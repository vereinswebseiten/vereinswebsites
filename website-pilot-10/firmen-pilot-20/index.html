const rows=String.raw\`hn-gmbh~HN GmbH~Bau · Generalunternehmung~München~Bauen mit Verantwortung~Ihr Bauprojekt. Von der ersten Idee bis zur Übergabe.~Als Generalunternehmer begleiten wir Neubau, Umbau und Sanierung mit klarer Planung, verlässlicher Koordination und einem hohen Anspruch an Qualität.~Mit mehr als neun Jahren Erfahrung steht die HN GmbH für die ganzheitliche Umsetzung von Bauvorhaben. Von der ersten Beratung über Planung und Projektmanagement bis zur Bauausführung und schlüsselfertigen Übergabe haben Sie einen verlässlichen Ansprechpartner an Ihrer Seite.~Schlüsselfertiger Neubau|Wir koordinieren Ihr Bauvorhaben von der Planung bis zur finalen Übergabe.^Energetische Komplettsanierung|Wir modernisieren Bestandsgebäude mit Präzision und Sorgfalt.^Statik & Architektur|Planung, Beratung und statische Kompetenz für Ihr Vorhaben.^Generalbauunternehmung|Organisation und Koordination der beteiligten Gewerke und Partner.^Projektmanagement|Klare Abläufe und transparente Kommunikation während des gesamten Projekts.^Referenzen|Einblicke in abgeschlossene Neubau-, Umbau- und Sanierungsvorhaben.~Ein Familienunternehmen. Ein Wort zählt: Verlässlichkeit.~Wir bauen nicht nur Gebäude, sondern Lebensräume. Dafür setzen wir auf bewährte Materialien, erfahrene Handwerker und partnerschaftliche Zusammenarbeit. Qualität, Zuverlässigkeit und transparente Kommunikation stehen im Mittelpunkt.~Landshuter Allee 49, 80637 München~089 901 83897~info@hngmbh.de~https://hngmbh.de/~photo-1486406146926-c627a92ad1ab~photo-1504307651254-35680f356dfd~construction
sgb-asz~SGB ASZ GmbH~Unternehmensabsicherung · Versicherungsmakler~Gröbenzell~Absichern. Vorausschauen. Verantwortung übernehmen.~Ganzheitliche Versicherungslösungen für Unternehmen.~Wir begleiten Unternehmen, Selbstständige und Führungskräfte mit maßgeschneiderten Absicherungskonzepten und praxisnaher Beratung.~Ihre Sicherheit in allen Lebens- und Unternehmenslagen: Wir verbinden fundierte Versicherungsberatung mit einem ganzheitlichen Blick auf unternehmerische Verantwortung. Digitalisierung, Fachkräftemangel, Haftungsrisiken und Gesundheitsvorsorge verlangen Lösungen, die zu Ihrem Unternehmen passen.~Unternehmensabsicherung|Individuelle Versicherungskonzepte für die Risiken und Anforderungen Ihres Unternehmens.^Geschäftsführer & Führungskräfte|Persönliche Absicherung mit Blick auf Verantwortung und individuelle Rahmenbedingungen.^Mitarbeiter & Gesundheitsvorsorge|Lösungen, die Unternehmen und Teams stärken.^Risikoanalyse|Eine objektive Marktuntersuchung als Grundlage fundierter Entscheidungen.^Strategische Begleitung|Ein persönlicher Ansprechpartner, der Ihr Unternehmen versteht.^Immobilien & Finanzierung|Ergänzende Vermittlungsleistungen im Rahmen der ausgewiesenen Erlaubnisse.~Mehr als ein Versicherungsmakler.~Wir verstehen uns als strategischer Partner. Gemeinsam betrachten wir Ihre Situation, Ihre Ziele und die Risiken, die für Ihr Unternehmen wirklich relevant sind. Daraus entstehen passgenaue Lösungen mit Weitblick.~Industriestraße 29–31, 82194 Gröbenzell~+49 8041 795 04 87~info@sgb-asz.de~https://sgb-asz.de/~photo-1454165804606-c3d57bc86b40~photo-1521737711867-e3b97375f902~corporate
baukunstwerk~BauKunstWerk~Planung · Steinrestaurierung~München~Substanz bewahren. Werte erhalten.~Historische Substanz. Mit Sorgfalt weitergedacht.~Planung und Steinrestaurierung für Bauwerke, deren Charakter und handwerkliche Qualität erhalten bleiben sollen.~BauKunstWerk knüpft an die Geschichte des Pfanner Planungsbüros und der Steinrestaurierung an. Im Mittelpunkt stehen die sorgfältige Auseinandersetzung mit historischer Bausubstanz, Materialien und den Anforderungen jedes einzelnen Bauwerks.~Steinrestaurierung|Sorgfältiger Umgang mit Naturstein und historischer Bausubstanz.^Planung|Durchdachte Planung als Grundlage für den verantwortungsvollen Umgang mit Bauwerken.^Bestand verstehen|Material, Zustand und bauliche Besonderheiten als Ausgangspunkt jeder Maßnahme.^Individuelle Lösungen|Jedes Objekt verlangt eine eigene Betrachtung – mit Respekt vor seiner Geschichte.~Jedes Bauwerk verdient einen genauen Blick.~Historische Substanz lässt sich nicht beliebig ersetzen. Sie verlangt Erfahrung, Verständnis für Material und sorgfältige Planung. Die Verbindung aus Planung und Steinrestaurierung steht dafür im Mittelpunkt.~Herzog-Johann-Straße 44, 81245 München~+49 89 881073~info@baukunstwerk.eu~https://www.baukunstwerk.eu/~photo-1511818966892-d7d671e672a2~photo-1600607687939-ce8a6c25118c~craft
a4w~a4w UG~IT-Beratung · Softwareentwicklung~Ottobrunn~Digitale Lösungen mit Substanz~IT-Beratung und Softwareentwicklung, die weiterbringt.~Technologie verstehen. Anforderungen strukturieren. Lösungen entwickeln, die zu Ihrem Unternehmen passen.~Die a4w UG ist in den Bereichen IT-Beratung und Softwareentwicklung tätig. Im Mittelpunkt stehen die Anforderungen Ihres Unternehmens – von der ersten Analyse bis zur passenden technischen Umsetzung.~IT-Beratung|Technische und fachliche Anforderungen verstehen und in klare nächste Schritte übersetzen.^Softwareentwicklung|Individuelle Softwarelösungen entlang konkreter Geschäftsanforderungen.^Konzeption & Architektur|Strukturierte Planung als Grundlage für wartbare und passende Lösungen.^Technische Umsetzung|Von der Idee zum funktionierenden Ergebnis – abgestimmt auf Ihren Bedarf.~Technologie ist dann gut, wenn sie Probleme löst.~Gute IT beginnt mit dem Verständnis für Prozesse, Menschen und Ziele. Daraus entsteht eine Lösung, die nicht nur technisch funktioniert, sondern im Alltag einen echten Mehrwert bietet.~Edelweißstraße 19b, 85521 Ottobrunn~~~~https://www.a4w.de/~photo-1497366754035-f200968a6e72~photo-1519389950473-47ba0277781c~tech
mariannenhof~Mariannenhof~Augustiner Bar · Restaurant · Lehel~München~Ein guter Platz für gute Stunden~Willkommen im Mariannenhof.~Augustiner, gutes Essen und Münchner Gastlichkeit – mitten im Lehel. Kommen Sie vorbei und machen Sie es sich gemütlich.~Der Mariannenhof verbindet die Atmosphäre einer Augustiner Bar mit einer Küche für den ganzen Tag. Ob zum Mittagessen, auf ein Getränk nach Feierabend oder für einen entspannten Abend – hier ist Platz für gute Gespräche und genussvolle Stunden.~Mittag genießen|Ab 11:30 Uhr ist der Mariannenhof ein Treffpunkt für die Mittagspause und den Start in den Tag.^Speisen zum Mitnehmen|Lieblingsgerichte gibt es auch zum Mitnehmen – einfach telefonisch nachfragen.^Augustiner & Bar|Ein frisch gezapftes Bier, ein Drink und ein gemütlicher Platz im Lehel.^Gemeinsam genießen|Ein Ort für Treffen mit Freunden, Familie und Kolleginnen und Kollegen.~Mitten im Lehel. Ganz nah am Leben.~Der Mariannenhof liegt in der Mariannenstraße und ist ein unkomplizierter Treffpunkt im Viertel. Ob spontan oder geplant – wir freuen uns auf Ihren Besuch.~Mariannenstraße 1, 80538 München~089 25544672~~https://mariannenhof-bar.de/~photo-1517248135467-4c7edcad34c4~photo-1414235077428-338989a2e8c0~food
kesslinger~Kesslinger GmbH~Freie Autowerkstatt · Schwabing Nord~München~Werkstattservice für alle Marken~Damit Sie zuverlässig weiterfahren.~Von Oldtimer bis Elektrofahrzeug: Wir warten und reparieren Fahrzeuge aller Marken – mit moderner Diagnostik und persönlichem Service.~Als freie Autowerkstatt in München-Schwabing Nord kümmern wir uns um Fahrzeuge aller Marken und Baujahre. Ob Benzin, Diesel, Hybrid oder Elektro – wir verbinden handwerkliche Erfahrung mit computergestützter Diagnostik.~Inspektion & Wartung|Regelmäßige Wartung und Inspektionen für viele Fahrzeugmarken.^Diagnose & Elektrik|Moderne computergesteuerte Diagnostik und gezielte Fehlersuche.^Bremsen & Fahrwerk|Achsvermessung, Bremsen und weitere wichtige Werkstattarbeiten.^HU / AU & Checks|Von der Prüfung bis zur Reparatur – alles rund ums Fahrzeug.^Reifen & Klimaanlage|Service für Komfort und Sicherheit zu jeder Jahreszeit.^Fotodokumentation & Hol-/Bringservice|Auf Wunsch dokumentieren wir Reparaturen per Foto. Abholung und Rücklieferung sind gegen Aufpreis möglich.~Transparenz, die Vertrauen schafft.~Auf Wunsch halten wir den Zustand Ihres Fahrzeugs während der Reparatur mit Fotos fest. So können Sie Alt- und Neuzustand nachvollziehen. Nach Vereinbarung holen wir Ihr Fahrzeug ab und bringen es zurück.~Stuttgarter Straße 24, 80807 München~0160 30 16 16 0~info@auto-kesslinger.de~https://auto-kesslinger.de/~photo-1486262715619-67b85e0b08d3~photo-1492144534655-ae79c964c9d7~craft
bernis-nudelbrett~Berni’s Nudelbrett~Ristorante & Pizzeria · Viktualienmarkt~München~Italienischer Genuss seit 1976~Ein Stück Italien mitten in München.~Hausgemachte Saucen, frische Pasta, knusprige Pizza und italienische Gastfreundschaft – direkt am Viktualienmarkt.~Seit 1976 verwöhnt die Familie Berni ihre Gäste im Herzen Münchens. In zweiter Generation führen wir unser familiengeführtes Restaurant mit italienischen Nudelgerichten, hausgemachten Saucen, Pizza sowie Fleisch- und Fischspezialitäten.~Pasta & hausgemachte Saucen|Italienische Nudelgerichte – auch mit glutenfreien Optionen.^Pizza|Knuspriger Teig und sorgfältig ausgewählte Zutaten.^Fisch- & Fleischgerichte|Herzhafte Klassiker und mediterrane Spezialitäten.^Salate & Desserts|Frische Begleiter und süße Momente zum Abschluss.^Vegane Optionen|Auch vegane Gerichte gehören zu unserem Angebot.^Feiern & Gruppen|Ein schöner Rahmen für Familienfeiern, Firmenessen und gemeinsame Abende.~Familiengeschichte mit italienischem Herzen.~Die Familie Berni stammt aus Bardi in der Region Parma. Seit dem 15. Juni 1976 ist unser Restaurant ein Treffpunkt für Münchner und Gäste aus aller Welt – mit Blick auf den Viktualienmarkt und viel Liebe zur italienischen Küche.~Petersplatz 8, 80331 München~+49 89 264469~bernisrest@t-online.de~https://www.bernisnudelbrett-restaurant.de/~photo-1555396273-367ea4eb4db5~photo-1559339352-11d035aa65de~food
